<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STACKLY · Admin Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin-dashboard.css" />
</head>
<body>
<div class="dashboard-root">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="./404.html" class="brand">
        <img src="../assets/stackly_logo.webp" alt="Stackly" class="brand-logo">
      </a>
      <button class="close-btn" id="close-sidebar-btn" aria-label="Close sidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="unit-strip">Admin Session</div>
    <div class="sidebar-section-label">Portfolio</div>
    <nav class="sidebar-nav" id="nav-main"></nav>
    <div class="sidebar-section-label">Operations</div>
    <nav class="sidebar-nav" id="nav-management"></nav>
    <div class="sidebar-user" id="sidebar-user">
      <div class="sidebar-user-avatar" id="sidebar-user-avatar">–</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebar-user-name">Signed out</div>
        <div class="sidebar-user-email" id="sidebar-user-email">—</div>
      </div>
    </div>
    <button class="logout-full-btn" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </aside>
  <main class="main-content">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
        <div class="page-title">
          <h1 id="page-title-text">Overview</h1>
        </div>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input placeholder="Search clients, engagements…">
        </div>
        <button class="icon-btn" id="notif-btn" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span class="notif-dot"></span></button>
        <div class="topbar-user" id="topbar-user">
          <button class="topbar-user-btn" id="topbar-user-btn">
            <span class="topbar-user-avatar" id="topbar-user-avatar">–</span>
            <span class="topbar-user-name" id="topbar-user-name">Signed out</span>
            <i class="fa-solid fa-chevron-down topbar-user-caret"></i>
          </button>
          <div class="topbar-user-menu" id="topbar-user-menu">
            <div class="topbar-user-menu-email">
              <div class="label">Email</div>
              <div class="value" id="topbar-user-email">—</div>
            </div>
            <button class="topbar-user-menu-item" data-nav="settings"><i class="fa-solid fa-gear"></i>&nbsp; Settings</button>
            <button class="topbar-user-menu-item danger" id="topbar-logout-btn"><i class="fa-solid fa-right-from-bracket"></i>&nbsp; Logout</button>
          </div>
        </div>
      </div>
    </header>
    <div class="content-area" id="content-area"></div>
  </main>
</div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="../js/admin-dashboard.js"></script>
</body>
</html>
