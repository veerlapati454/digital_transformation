<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Stackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<!-- Sticky brand logo — lives outside .login-shell so position:fixed
     pins it to the viewport and it stays visible while scrolling,
     on both the desktop split layout and the mobile stacked layout. -->
<a href="../index.html#home" class="login-brand">
  <img src="../assets/stackly_logo.webp" alt="Stackly logo" class="login-brand-logo">
</a>

<div class="login-shell">

  <!-- LEFT: visual panel -->
  <div class="login-visual">
    <img loading="eager" decoding="async" src="https://picsum.photos/seed/stackly-login-hand/1000/1200" alt="A hand reaching toward a glowing digital network, symbolizing human decisions guided by data" class="login-visual-img">
    <div class="login-visual-scrim" aria-hidden="true"></div>

    <h1 class="login-visual-title">Welcome</h1>
  </div>

  <!-- RIGHT: form panel -->
  <div class="login-panel">
    <div class="login-panel-inner">
      <a href="../index.html" class="login-back-top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
        Back to Home
      </a>

      <span class="login-eyebrow">Hello</span>
      <h2 class="login-heading">We are glad to see you :)</h2>

      <div class="login-social">
        <a href="./404.html" class="login-social-google">
          <span class="login-social-google-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.2 14.7 2.2 12 2.2 6.9 2.2 2.7 6.4 2.7 11.6S6.9 21 12 21c6.9 0 8.9-4.8 8.9-7.3 0-.5-.05-.9-.13-1.3H12z"/></svg>
          </span>
          Sign up with Google
        </a>
        <a href="./404.html" class="login-social-circle" aria-label="Continue with Facebook">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8.4h2.8l.4-3.3h-3.2V8.1c0-.95.26-1.6 1.63-1.6H16.9V3.5c-.28-.04-1.25-.12-2.38-.12-2.36 0-3.98 1.44-3.98 4.1v2.29H8v3.3h2.54V22h2.96z"/></svg>
        </a>
        <a href="./404.html" class="login-social-circle" aria-label="Continue with X/Twitter">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.2 3h2.9l-6.34 7.25L21.2 21h-5.84l-4.57-5.98L5.56 21H2.66l6.78-7.75L2.4 3h5.98l4.13 5.47L17.2 3zm-1.02 16.2h1.6L7.9 4.7H6.18l10 14.5z"/></svg>
        </a>
      </div>

      <div class="login-divider"><span>Or</span></div>

      <form id="loginForm" class="login-form" novalidate>

        <fieldset class="login-role">
          <legend class="login-field-label">Login as</legend>
          <div class="login-role-options">
            <label class="login-role-pill">
              <input type="radio" name="role" value="user" checked>
              <span>User</span>
            </label>
            <label class="login-role-pill">
              <input type="radio" name="role" value="admin">
              <span>Admin</span>
            </label>
          </div>
        </fieldset>

        <div class="login-field login-field--full">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@gmail.com" autocomplete="email" required>
          <span class="login-hint" data-error-for="email">Only @gmail.com addresses are accepted.</span>
        </div>

        <div class="login-field login-field--full">
          <label for="password">Password</label>
          <div class="login-password-wrap">
            <input type="password" id="password" name="password" placeholder="xxxxxxxx" autocomplete="current-password" minlength="6" required>
            <button type="button" class="login-password-toggle" data-target="password" aria-label="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 4.22-5.36M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.5 20.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="login-hint" data-error-for="password">Password must be at least 6 characters.</span>
        </div>

        <div class="login-row">
          <label class="login-remember">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="./404.html" class="login-forgot">Forgot password?</a>
        </div>

        <button type="submit" class="login-submit">Login</button>

        <p class="login-signup-prompt">
          Don't have an account? <a href="./signup.html" class="login-signup-link">Create account</a>
        </p>
      </form>

    </div>
  </div>

</div>

<script src="../js/login.js"></script>
</body>
</html>
