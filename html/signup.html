<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Stackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/signup.css">
</head>
<body>

<div class="signup-shell">

  <!-- LEFT: brand + hex grid (fixed, does not scroll) -->
  <div class="signup-visual">
    <div class="signup-visual-glow" aria-hidden="true"></div>

    <a href="../index.html#home" class="signup-brand">
      <img src="../assets/stackly_logo.webp" alt="Stackly logo" class="signup-brand-logo">
    </a>

    <div class="hex-grid" aria-hidden="true">

      <div class="hex-col hex-col--a">
        <div class="hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 18a4 4 0 0 1-.5-7.97A5 5 0 0 1 15 8.5a4.5 4.5 0 0 1 1 8.9"/><circle cx="6" cy="20.2" r="0.9" fill="currentColor" stroke="none"/><circle cx="10" cy="20.2" r="0.9" fill="currentColor" stroke="none"/><circle cx="14" cy="20.2" r="0.9" fill="currentColor" stroke="none"/><path d="M6 18v2.2M10 18v2.2M14 18v1.7"/></svg>
        </div>
        <div class="hex hex--label">API</div>
      </div>

      <div class="hex-col hex-col--b">
        <div class="hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4a3 3 0 0 0-3 3v1a3 3 0 0 0-2 2.8v0A3 3 0 0 0 6 16h0"/><path d="M15 4a3 3 0 0 1 3 3v1a3 3 0 0 1 2 2.8v0a3 3 0 0 1-2 2.2h0"/><path d="M9 4c0 5 0 11 0 15M15 4c0 5 0 11 0 15"/><path d="M9 9h6M9 13h6"/></svg>
        </div>
        <div class="hex hex--text">Digital<br>Transformation</div>
        <div class="hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </div>
      </div>

      <div class="hex-col hex-col--a">
        <div class="hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21c-1 0-2-1-2-3v-3c0-1.5-2-1.5-2-3s2-1.5 2-3V6c0-2 1-3 2-3"/><circle cx="13" cy="9" r="2.3"/><path d="M13 11.3c-2 .3-3.3 1.6-3.3 3.3"/></svg>
        </div>
        <div class="hex">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.2" r="1.1" fill="currentColor" stroke="none"/></svg>
        </div>
      </div>

    </div>
  </div>

  <!-- RIGHT: form panel (scrolls independently) -->
  <div class="signup-panel">
    <div class="signup-card">

      <button type="button" class="signup-back-top" onclick="history.back()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
  Back
</button>

      <span class="signup-eyebrow">Get started</span>
      <h2 class="signup-heading">Create your account</h2>

      <div class="signup-social">
        <a href="./404.html" class="signup-social-google">
          <span class="signup-social-google-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.2 14.7 2.2 12 2.2 6.9 2.2 2.7 6.4 2.7 11.6S6.9 21 12 21c6.9 0 8.9-4.8 8.9-7.3 0-.5-.05-.9-.13-1.3H12z"/></svg>
          </span>
          Sign up with Google
        </a>
        <a href="./404.html" class="signup-social-circle" aria-label="Continue with Facebook">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8.4h2.8l.4-3.3h-3.2V8.1c0-.95.26-1.6 1.63-1.6H16.9V3.5c-.28-.04-1.25-.12-2.38-.12-2.36 0-3.98 1.44-3.98 4.1v2.29H8v3.3h2.54V22h2.96z"/></svg>
        </a>
        <a href="./404.html" class="signup-social-circle" aria-label="Continue with X/Twitter">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.2 3h2.9l-6.34 7.25L21.2 21h-5.84l-4.57-5.98L5.56 21H2.66l6.78-7.75L2.4 3h5.98l4.13 5.47L17.2 3zm-1.02 16.2h1.6L7.9 4.7H6.18l10 14.5z"/></svg>
        </a>
      </div>

      <div class="signup-divider"><span>Or</span></div>

      <form id="signupForm" class="signup-form" novalidate>

        <div class="signup-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="e.g. janedoe" autocomplete="username" pattern="[A-Za-z]+" maxlength="24" required>
          <span class="signup-hint" data-error-for="username">Letters only, no spaces or numbers.</span>
        </div>

        <div class="signup-field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="e.g. Jane Doe" autocomplete="name" pattern="[A-Za-z\s]+" maxlength="48" required>
          <span class="signup-hint" data-error-for="fullName">Letters only.</span>
        </div>

        <div class="signup-field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@gmail.com" autocomplete="email" required>
          <span class="signup-hint" data-error-for="email">Only @gmail.com addresses are accepted.</span>
        </div>

       <div class="signup-field">
  <label for="password">Password</label>
  <div class="signup-password-wrap">
    <input type="password" id="password" name="password" placeholder="xxxxxxxx" autocomplete="new-password" minlength="6" required>
    <button type="button" class="signup-password-toggle" data-target="password" aria-label="Show password">
      <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 4.22-5.36M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.5 20.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
  </div>
</div>

<div class="signup-field">
  <label for="confirmPassword">Confirm Password</label>
  <div class="signup-password-wrap">
    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="xxxxxxxx" autocomplete="new-password" minlength="6" required>
    <button type="button" class="signup-password-toggle" data-target="confirmPassword" aria-label="Show password">
      <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 4.22-5.36M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.5 20.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
    <span class="signup-hint" data-error-for="confirmPassword">Passwords must match.</span>
  </div>
</div>

        <label class="signup-terms">
          <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
          <span>I agree to the <a href="./404.html">Terms and Conditions</a></span>
        </label>
        <span class="signup-hint" data-error-for="agreeTerms">You must accept the Terms and Conditions to sign up.</span>

        <button type="submit" class="signup-submit">Sign Up</button>

        <p class="signup-login-prompt">
          Already have an account? <a href="./login.html" class="signup-login-link">Login</a>
        </p>
      </form>

    </div>
  </div>

</div>

<script src="../js/signup.js"></script>
</body>
</html>
